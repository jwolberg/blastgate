# CI for Blastgate. npm-based: the tool is npm-first and dogfoods its own
# package-lock.json (U4 + the self-scan in the plan's Definition of Done), so the
# project uses npm rather than the harness default of bun — see
# docs/implementation-notes.md.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege (Blastgate dogfood): this workflow only checks out, builds, and
# tests — it needs no write scopes and holds no secrets. Declaring `contents: read`
# at the top level sets every other GITHUB_TOKEN scope to `none`, so even if the
# repo/org default is read-write, this job can't be. A fork `pull_request` already
# runs with a read-only token and no secrets; this makes that guarantee explicit.
permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # PR code runs in the build/test steps below; don't leave the token in
          # .git/config where an untrusted step could reuse it.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Format check
        run: npm run format:check
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
      # Dogfood (0026): Blastgate gates its own repo. The JSON report is written
      # first (always, for the artifact), then the gate runs — a fail verdict exits
      # non-zero and fails this required check. "We pass our own gate, here's the
      # artifact" is the credibility argument for the reference implementation.
      - name: Self-scan
        run: |
          node dist/cli/index.js . --json > blastgate-report.json || true
          node dist/cli/index.js .
      - name: Publish self-scan report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blastgate-self-scan
          path: blastgate-report.json
