name: gemini-issue-triage
# GHSA-wpqr-6v78-jr5g / Pillar Security shape: any issue author drives a --yolo agent
# with every tool, in a job that can mint a GCP credential over OIDC.
on:
  issues:
    types: [opened, reopened]
permissions:
  contents: read
  id-token: write
  issues: write
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/run-gemini-cli@v0
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        with:
          gcp_workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          gcp_project_id: ${{ vars.GOOGLE_CLOUD_PROJECT }}
          use_vertex_ai: true
          prompt: |
            Read the issue from $ISSUE_TITLE and $ISSUE_BODY and apply labels with gh.
